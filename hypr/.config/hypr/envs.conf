# Extra env variables
# env = MY_GLOBAL_ENV,setting
# Theme directory name is breeze_cursors (not "Breeze").
# "Breeze" is the icon theme and has no cursors, so XCursor falls back
# to Hyprland's bluish default pointer.
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
