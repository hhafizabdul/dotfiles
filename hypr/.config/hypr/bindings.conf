# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browse

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-or-focus brave
bindd = SUPER SHIFT ALT, B, Brave Browser, exec, omarchy-launch-or-focus brave
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, G, Grok, exec, omarchy-launch-webapp "https://gemini.google.com"
# bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, C, AI Search, exec, omarchy-launch-webapp "https://google.com/ai"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
bindd = SUPER SHIFT, M, YT Music, exec, omarchy-launch-or-focus-webapp "YouTube Music" "https://music.youtube.com"
bindd = SUPER SHIFT, P, Perplexity, exec, omarchy-launch-or-focus-webapp "Perpleixity" "https://perplexity.ai"

# Window management bindings
unbind = SUPER, W
bindd = SUPER, Q, Close active window, killactive
unbind = SUPER, F
bindd = SUPER, F, Full width, fullscreen, 1
unbind = SUPER ALT, F
bindd = SUPER ALT, F, Force full screen, fullscreen, 0

#Resize windows with SUPER + ALT + arrow keys
# bindd = SUPER ALT, LEFT, Resize window left, resizeactive, -100 0
# bindd = SUPER ALT, RIGHT, Resize window right, resizeactive, 100 0
# bindd = SUPER ALT, UP, Resize window up, resizeactive, 0 -100
# bindd = SUPER ALT, DOWN, Resize window down, resizeactive, 0 100

# Screenshot bindings
# bindd = SUPER SHIFT, S, Smart screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = SUPER SHIFT, S, Screenshot area (Save + Both clipboards), exec, ~/.config/hypr/screenshot.sh
bindd = SUPER ALT SHIFT , S, Screenshot area (Save + Swappy edit), exec, ~/.config/hypr/screenshot-edit.sh
# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
